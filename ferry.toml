[server]
bind = "0.0.0.0:4000"

[local]
name = "strata"
api_base = "http://192.168.9.99:8080/v1"
api_key = "sk-strata-stevegaming"
model = "qwen3.8-flash-next-iq2_xs"
max_slots = 4
max_context_tokens = 256000
total_kv_token_budget = 1024000
adaptive_squeezing = true
adaptive_squeeze_ratio = 1.35
timeout_secs = 240
connect_timeout_secs = 5
circuit_breaker_threshold = 3
probe_interval_secs = 5
queue_timeout_ms = 45000

[cloud]
name = "minimax"
api_base = "https://api.minimax.io/v1"
api_key = ""
model = "MiniMax-M3"
timeout_secs = 300

[affinity]
enabled = true
max_slots = 4
timeout_secs = 3600
idle_reclaim_secs = 60

[condensation]
enabled = true
drop_historical_reasoning = true
truncate_tool_outputs = true
keep_recent_turns = 1
max_tool_chars = 1200
recent_max_tool_chars = 24000
head_lines = 12
tail_lines = 8
strip_ansi_escapes = true
strip_progress_bars = true
collapse_whitespace = true
deduplicate_lines = true
minify_json_outputs = true
prune_lockfile_diffs = true
suppress_base64_blobs = true
shield_dir_traversals = true
protect_code_blocks = true
enable_constraint_ledger = true
protect_static_prefix = true
fold_repeated_tool_failures = true
rolling_compaction = true
compact_threshold_tokens = 16000
compact_keep_recent_turns = 3

[telemetry]
enabled = true
pushgateway_url = "http://10.10.10.101:9091"
push_interval_secs = 5
job_name = "sentry_ferry"
